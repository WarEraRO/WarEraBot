# WarEra production recipes. Sources: GUIDE section 16 + LIVECFG items.* (2026-10-04). Both agree.
# pp = production points needed per 1 unit; inputs = raw units consumed per 1 unit.
# Romanian names are given for mapping the source guide. 'code' = live config item code.
table_version: 1
as_of: "2026-10-04"
source: [GUIDE, LIVECFG]

raw:
  - {code: iron,      name: Iron,            ro: Fier,               pp: 1,  climates: [moderate, arid, tropical, polar], used_for: steel}
  - {code: lead,      name: Lead,            ro: Plumb,              pp: 1,  climates: [moderate, arid, polar],           used_for: "light ammo, ammo, heavy ammo"}
  - {code: coca,      name: Mysterious Plant, ro: "Planta Misterioasa", pp: 1, climates: [tropical],                     used_for: pill}
  - {code: fish,      name: Fish,            ro: Peste,              pp: 40, climates: [polar],                           used_for: cooked fish}
  - {code: livestock, name: Livestock,       ro: Animale,            pp: 20, climates: [moderate, tropical],              used_for: steak}
  - {code: grain,     name: Grain,           ro: Cereale,            pp: 1,  climates: [moderate, tropical],              used_for: bread}
  - {code: petroleum, name: Petroleum,       ro: Titei,              pp: 1,  climates: [moderate, arid, tropical],        used_for: oil}
  - {code: limestone, name: Limestone,       ro: Calcar,             pp: 1,  climates: [moderate, arid],                  used_for: concrete}
  - {code: wood,      name: Wood,            ro: Lemn,               pp: 1,  climates: [moderate, tropical, polar],       used_for: paper}

products:
  - {code: steel,      name: Steel,       ro: Otel,           pp: 10,  inputs: {iron: 10},      use: "company/MU/region upgrades, bunkers, bases, MU creation (unit unstated), crafting"}
  - {code: concrete,   name: Concrete,    ro: Beton,          pp: 10,  inputs: {limestone: 10}, use: "new companies, company move/product change, MU creation, construction, move home (100)"}
  - {code: lightAmmo,  name: Light Ammo,  ro: "Munitie usoara", pp: 1, inputs: {lead: 1},       use: "+10% attack (compatible weapon)"}
  - {code: ammo,       name: Ammo,        ro: Munitie,        pp: 4,   inputs: {lead: 4},       use: "+20% attack"}
  - {code: heavyAmmo,  name: Heavy Ammo,  ro: "Munitie grea", pp: 16,  inputs: {lead: 16},      use: "+40% attack"}
  - {code: bread,      name: Bread,       ro: Paine,          pp: 10,  inputs: {grain: 10},     use: "+10% max health, 1 hunger"}
  - {code: steak,      name: Steak,       ro: Friptura,       pp: 20,  inputs: {livestock: 1},  use: "+15% max health, 1 hunger"}
  - {code: cookedFish, name: Cooked Fish, ro: "Peste prajit", pp: 40,  inputs: {fish: 1},       use: "+20% max health, 1 hunger"}
  - {code: oil,        name: Oil,         ro: Petrol,         pp: 1,   inputs: {petroleum: 1},  use: "HQ/bunker/base/pacification upkeep; travel fuel (2 per region beyond Stamina) until movement is off ~2026-11-10 (v0.28)"}
  - {code: paper,      name: Paper,       ro: Hartie,         pp: 1,   inputs: {wood: 1},       use: "laws, orders, motions, treaties, diplomatic upkeep"}
  - {code: cocain,     name: Pill,        ro: Pastila,        pp: 200, inputs: {coca: 200},     use: "+60% attack 8h, then -60% 15.5h"}

notes:
  - "Total base PP embodied in a processed unit = recipe pp + sum(input_qty * input_pp). E.g. steel = 10 + 10*1 = 20 base PP; steak = 20 + 1*20 = 40; cooked fish = 40 + 40 = 80; pill = 200 + 200 = 400."
  - "Whether bonus output consumes inputs is ambiguous in the guide - see references/formulas.md#F-PROFIT and unresolved-mechanics.md U-ECO-1."
  - "Scrap ('scraps') is tradable but not produced by companies; it comes from dismantling equipment."
