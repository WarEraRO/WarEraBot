    notes: "Read-only fetch of the public JS, no key. Confirms v0.27.1 client-side: employee storyteller minHiredHours 0 (was 48); fire config {coworkerHappinessPenalty 5, penaltyHours 24} with no rerollWithinHours. Still ships employee battle {happinessPenalty 5, casualtyChance 0.01} although v0.27.1 says no battle deaths 'for now' (server-side; the patch note wins) and Homesick's condition OUTSIDE_HOME_COUNTRY (the occupied-region exemption is server-side). Holds the full government-type modifier table (module 29515: defaults, per-type overrides, GOV_TYPE_CHANGE_COOLDOWN 30, order-cost function) - every value matches PATCH_0_27. Wooden-case config: lootChancePercent 25, maxPerUser 5, expiryHours 48, starterCases 3 for 168 h, productionValueByRarity 20-40/40-70/80-130/160-260, one 20-item resourcePool. No battle-bonus cap constant found (bonus components come from server data)."
  - id: TRANSLATION_EN
    title: "vatoutou/warera-translation en/messages.po (the game's lingui English catalog), commit a8060359fca8 (2026-10-27T17:46:42Z)"
