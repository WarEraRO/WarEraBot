# WarEra versioned mechanics registry.
# Single source of truth for VOLATILE scalar/tabular values used in reasoning and scripts.
# Schema: references/versioned-mechanics.md   Validation: scripts/validate_mechanics.py
#
# Rules:
# - Never overwrite a value. When it changes, close the old entry (effective_to / status: historical)
#   and append a new entry. Scheduled changes get status: scheduled + effective_from.
# - Only ONE entry per mechanic may be active (current/disputed) at any instant.
# - authority: game_mechanic | community_strategy | romanian_policy | community_observation
# - status:    current | disputed | scheduled | historical | deprecated
# - confidence: high | medium | low
# - Dates are UTC ISO-8601 strings. Unknown dates are omitted (null) - never guessed.

schema_version: 1
registry_as_of: "2026-11-04"  # rev 14: v0.28 (fight from anywhere; movement, Stamina, wooden cases, free trip home and the two map milestones scheduled off ~2026-11-10; Nationalist/Statist/Foreman happiness given directly, Nationalist +11 -> +10; removed v0.27 links closed, map diameter 20), checked against the live config, client, UI catalog and region graph; rev 13: v0.27.4 (ageing per day worked or trained, disabled companies on hold, Talks to Machines, Bully bad, Reroll card, Wild card Rare +2, no mixed New habit, tool returns on move, event rebalance, crafting at 7, new-country vote exemption; trait-Production wage claim disputed by the live API), checked against the live client, config, UI catalog and 70 rosters; rev 12: silent patch 2026-10-31 (Trainer shared 2-session pool, Lucky charm snapshot at 00:00 UTC) and the unannounced toolbox-cap removal of 2026-10-29, checked against the live client, UI catalog and 60 rosters; rev 11: v0.27.3 patch (Leadership merged into Management, Responsibility +3 happiness, one trait per hire, free transfers and firing, Early bloomer), checked against the live client, config and API

