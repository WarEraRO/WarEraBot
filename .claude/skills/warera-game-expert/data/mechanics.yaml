  - id: PATCH_0_27_2
    title: "Admin article 'v0.27.2' (6ae2608f707baf45eebf26c5)"
    date: "2026-10-28"
    game_version: "v0.27.2"
    priority: 2
    kind: patch_notes
    notes: "Official (category official, author 6813b758efecdf9bab195068), read in full with article.getArticleById on 2026-10-29. createdAt 2026-10-28T20:52:31Z, publishedAt 20:52:37Z, updatedAt 2026-10-29T18:14Z (no '(UPDATED)' in the title). Balance: 'Region development & Strategic resources income doubled'; new players start with 100 money instead of 25; 'No more contradicting traits on new employees (Loyal + Flight risk, Patriot + Expat, Loner + Mentor...)'. New: employees on the map (map filter, employee count per region); candidates countdown in the hiring window until the daily refresh at 00:00 UTC; employee names fit their country, every country has its own names; training cards show the before -> after value; API tokens can read your employees and their events. Improvement: event odds bar reads failures on the left, successes on the right. Fix: long press on links in the iOS app no longer opens a link preview. Newest article in the official category on 2026-10-29. effective_from uses the publishedAt day (2026-10-28, user rule 2026-10-13)."
  - id: LIVECFG_V0272
    title: "Live gameConfig.getGameConfig and client bundle (pages/_app-bd1b3e64c9b49e55.js) after v0.27.2, read 2026-10-29"
    date: "2026-10-29"
    game_version: "v0.27.2"
    priority: 1
    kind: trusted_script_output
    notes: "Read-only, no key. check_config.py (no --update) against the 2026-10-04 snapshot: 250 keys added, 65 removed, 63 changed. LIVECFG_V027 (2026-10-26) had 248 / 65 / 63, so the only new keys are region.developmentIncomeMultiplier = 2 and region.strategicResourceIncomeMultiplier = 2 (the client's gameConfig copy has the same two). Client module 22648 now exports 32 incompatible trait pairs (the 14 recorded on 2026-10-26 plus 18 more); the training-card pool builder uses them to drop New habit, Two new habits and Wild card options that would clash with a trait the employee already has. traitsPerEmployee still {min 0, max 1}. The client shows region and country income x 24 ('Estimated daily income'), so the API income fields are per hour. Starting money is not in the config or the client."
  - id: LIVEAPI_20261029
    title: "Live API sample with the bot's API key, 2026-10-29 (read-only queries, ~1 request/s)"
    date: "2026-10-29"
    game_version: "v0.27.2"
    priority: 1
    kind: trusted_script_output
    notes: "employee.getCompanyRoster for the first 120 ids of company.getCompanies (261 employees); region.getById for the 40 regions they work in; country.getCountryById for those regions' owners; country.getAllCountries for development values. Region income (per hour): development = region development x 2 / 24 in all 40 regions; strategicResourcesBonus = the original country's coreDevelopment x 2 / 24 in all 9 checked (not current or average development); the govType line adds Republic +100% (core region), Nationalist State -30% (core and conquered) and Plutocracy +50% of the strategic-resource line plus +40% of the tax lines, all on top of the doubled amounts. Employees: every trait beyond the first is explained by trainingHistory (Wild card, New habit) except 5 event relationship traits (Old friends, Nemesis), which fits 0-1 traits at hire; 2 employees hold a newly banned pair (Envious + Modest, Loner + Trainer), both created by Wild cards drawn on 2026-10-28 before the patch and still present on 2026-10-29; none of the 29 Wild cards drawn after the patch produced a clash."
  - id: PATCH_0_27_3
    title: "Admin article 'v0.27.3' (6ae39f39b9d173140341a461)"
    date: "2026-10-29"
    game_version: "v0.27.3"
    priority: 2
    kind: patch_notes
    notes: "Official (category official, author 6813b758efecdf9bab195068), read in full with article.getArticleById on 2026-10-30. createdAt 2026-10-29T19:32:09Z, publishedAt 19:32:40Z, updatedAt 2026-10-30T06:45Z (no '(UPDATED)' in the title). Hiring: candidates show all stats and wage, trait and potential once hired; new employees always have one trait; Specialist traits match the company's good (from training too); new hires can only be fired 12 h after hiring. Employees: Leadership is now part of Management (better training cards and +2% event odds per level; Leadership points refunded); 1 free skill reset, no cooldown; Responsibility +3 happiness per point (was -10% happiness loss per point); transfers between your companies free (was -5 happiness for 7 days) and firing right after a transfer (was 24 h later); firing no longer costs coworkers happiness (was -5 for 24 h); Luck: every point adds +4% (or +2% on some events) in events (the first 3 did nothing). Traits and training: Early bloomer replaces Sprinter (+6 Production until 40, then -2 per 10 years, gone at 60; Sprinters switch automatically); Rehab removes bad traits only and is always Rare; training cards show the wage change, Wild card shows the chance of a bad trait. Other: profit estimates use the PP value of the produced good instead of the average of all goods; the equip-tool menu always opens; tutorial step on traits. Fix: events hit the tool and coworkers present when they appeared. effective_from uses the publishedAt day (2026-10-29, user rule 2026-10-13)."
  - id: LIVECLIENT_V0273
    title: "Live client bundle (pages/_app-7b600575a3d47dea.js) and gameConfig after v0.27.3, read 2026-10-30"
    date: "2026-10-30"
    game_version: "v0.27.3"
    priority: 1
    kind: trusted_script_output
    notes: "Read-only, no key. Employee constants: traitsPerEmployee {min 1, max 1}; fire {hireLockHours 12} (coworker penalty keys gone); move {companyMoveHappinessPenalty 10, penaltyDays 7} (employee-move penalty and fire lock gone); responsibilityHappinessPerPoint 3; skills {managementBonusPercentPerLevel 2, managementWeightShiftPerLevel uncommon 1 / rare 0.6 / epic 0.3 / legendary 0.1}, fed the Management level by the rarity function (common = max(0, 55 - sum of shifts)); storyteller check {skillPerLevel 2, statPivot 0 (was 3), statPerPoint 4, luckPerPoint 2, happinessDivisor 5}; the Management skill tooltip shows level x 2 as event odds; event option bases unchanged (retirement 70, Business Opportunity 40, Locker Hoard 35). Traits: EARLY_BLOOMER {weight 5, peakDelta 6, delta -2, perYears 10, ageAbove 30, capDelta -6}; no SPRINTER; 52 traits, weights still 354; 30 incompatible pairs (the three Sprinter pairs gone, Early bloomer/Late bloomer added). Training: fixedRarity.rehabNegativeSpecial rare, Rehab offered only for negative traits; the Wild card's displayed bad-trait chance = negatives / eligible traits. Skill ladders (client module 68564) and gameConfig.skills both list energy, stamina, health, hunger, attack, companies, production, criticalChance, criticalDamages, armor, precision, dodge, lootChance, management: no leadership, 13 point-buyable skills."
