  - id: PATCH_0_27_1
    title: "Admin article 'v0.27.1' (6ae0defd260ab3cd58036d7a)"
    date: "2026-10-27"
    game_version: "v0.27.1"
    priority: 2
    kind: patch_notes
    notes: "Official (category official, author 6813b758efecdf9bab195068), read in full 2026-10-27. createdAt 2026-10-27T17:27Z, publishedAt 17:37Z, edited 17:55Z. Balance: firing a fresh hire is free; no employee deaths in battles 'for now'; Homesick employees are fine in their country's occupied regions; alliance leave cooldown reset and off until 30 October; employee events can happen right after hiring (no 48 h wait). Fixes: manager wages divided by 10; managers paid every hour even with no employees; managers can leave paused companies; absurdly priced market offers removed (items returned); taxes kept at 2 decimals; map links between non-bordering regions closed (Jabal al Akhdar-New Valley, Ar Riyad-Ha'il, Naxcivan-Eastern Anatolia, Northern Sudan-South-Eastern Sudan, South-Eastern Sudan-Tigray and Afar, all 'weird' Virginia links). New UI: order arrows on the map, same-price checkbox for multi-item listings, seller flags on offers, Advanced view with employee stats on the companies page, estimated profit on manager offers, Refresh app. effective_from uses the publishedAt day (2026-10-27, user rule 2026-10-13); the client read at ~18:00Z the same day (LIVECLIENT_V0271) already carried the event and firing changes."
  - id: LIVECLIENT_V0271
    title: "Live game client bundle app.warera.io (pages/_app-68269fc0817be98a.js, build 3lr-BW6ZMlv8vlLIWaQ-A), read 2026-10-27 ~18:00 UTC"
    date: "2026-10-27"
    game_version: "v0.27.1"
    priority: 1
