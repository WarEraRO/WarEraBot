  - id: CODEX
    title: "UNIKHORNE 'Codex - WarEra rules reference' (warera.unikhorne.dev/codex; JSON /api/codex and /api/codex/patchnotes)"
    date: "2026-10-26"
    priority: 5
    kind: community_guide
    notes: "Third-party aggregator by the UNIKHORNE tools site (operator plays as 'Khorne'), English/German, 62 entries in 7 categories + rank ladder + 97 admin articles (v0.15.0 -> v0.26.0, fetched 2026-09-15). Each entry carries its own sources and a trust tier (engine / official / guide / wiki). 'engine' means the site's damage engine reproduces skills.attack.total of 83+ live profiles - this covers attack OUTSIDE battle only, never battle bonuses. Sub-sources it cites: Fight Skills Mechanics Guide (PrinceRealMarijn, 2026-05-30), Economic Skills Mechanics Guide (2026-06-18), Complete Game Guide V1 (2026-06-18), Infrastructure Guide (2026-01-17), case/scrap articles (2026-05/06), XP census (2026-08-18), dev-client config (dev.warera.io 0.27.0-beta, 2026-10-25), Piraterer's Employee Training Guide 2.0 (2026-10-25, app.warera.io/article/6ade935e2284d0115d0de773), and the operator's own in-game measurements (2026-09). Ingested 2026-10-26; claims kept as [CODEX] unless independently verified. Its rank table and several politics entries are copied from the same wiki the skill already uses, so they are not independent corroboration. Some entries are stale (civil war keeps orders/bunker; election level 15; old alliance curve in its diplomacy entry)."
