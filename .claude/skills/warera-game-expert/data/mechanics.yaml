        notes: "Formula official since v0.20.0 (2025-12-14; replaced a flat 8 development per region); Core/Current/Average from v0.25.0 (2026-06-10); active = level >= 10 since v0.23.4 (2026-03-04; >= 3 before). Exponent vs factor is open: U-DEV-1a records the user's 'x 0.95', but the raw article HTML reads '((population <em>avgLevel) / 20) </em>* 0.95', i.e. the editor ate one '*' of each pair, which leaves '**' (power) as the likely original; the wiki's 98.3 example also fits the power. Region income = development is confirmed by GUIDE. Example: 100 active citizens with average level 25 -> 125^0.95 = 98.2 (wiki says 98.3); x 0.95 would give 118.75. Closed by v0.27.2, which doubled the region income only; the definitions carry over unchanged."
      - value: {initial: "((active citizens * average level) / 20) ^ 0.95", types: "Core, Current, Average = midpoint of Core and Current", average_used_for: "alliance upkeep, diplomacy upkeep, battle order costs (per alliance page), region upgrade upkeep", region_income: "2 coins per development point per day, paid hourly (development x 2 / 24 per hour)", income_multiplier: 2}
        status: current
        changed_in: v0.27.2
        effective_from: "2026-10-28T00:00:00Z"
        source: [PATCH_0_27_2, LIVECFG_V0272, LIVEAPI_20261029, WIKI, GUIDE]
        last_verified: "2026-10-29"
        confidence: high
        notes: "v0.27.2: 'Region development & Strategic resources income doubled'. Config region.developmentIncomeMultiplier = 2 (new key). The development values themselves did not change, so upkeep, order and resistance-bar costs that read development are untouched [Derived from the key name and the API sample]. Live API 2026-10-29: region.income.development = development x 2 / 24 in all 40 sampled regions (the client multiplies by 24 for 'Estimated daily income'). Government-type multipliers apply on top of the doubled amount as a separate govType line (Republic core region x2 -> 4 coins per point per day; Nationalist State x0.7 -> 1.4; Autocracy x1.25 -> 2.5 [Derived, Autocracy not sampled]). The definition rows (initial formula, exponent question U-DEV-1a, Core/Current/Average) carry over from the closed entry."

