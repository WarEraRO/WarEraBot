  - id: SILENT_20261031
    title: "Community article 'Silent patch notes again? - Trainer abuse fixed, Training shows profit, Reorganize function' (6ae682c7470184738824c070)"
    date: "2026-11-01"
    game_version: "v0.27.3 + silent patch 2026-10-31 (no version, no official article)"
    priority: 7
    kind: community_guide
    notes: "By Piraterer (69a74ba543bacf277582fe11), category news, publishedAt 2026-11-01T00:08:55Z, edited 17:09Z; read with article.getArticleById on 2026-11-01, all 9 screenshots viewed. Reports a silent (unannounced) admin patch: Trainer and Lucky charm changed ('got abused, got fixed'; tooltip screenshots), training cards show an estimated profit per day and the hand rarity, a Reorganize workforce tool for everyone, skin propositions removed. No official article exists for it (official category checked 2026-11-01: newest is v0.27.3). Every rule it reports was confirmed by LIVECLIENT_20261101 and LIVEAPI_20261101, so the registry entries rest on those."
  - id: LIVECLIENT_20261101
    title: "Live client bundle (pages/_app-dae8b3a034a90613.js) and the English UI catalog history (vatoutou/warera-translation), read 2026-11-01"
    date: "2026-11-01"
    game_version: "v0.27.3 + silent patch 2026-10-31"
    priority: 1
    kind: trusted_script_output
    notes: "Read-only, no key. Traits: TRAINER {condition ANY_COWORKER, weight 5, effect {trainerSessionsPerDay 2}} (was coworkerExtraTrainingsPerDay, +1 for every coworker); LUCKY_CHARM unchanged {coworkerStat luck, coworkerDelta 3}, with a new tooltip note; luck {charmGraceHours 1 (new, used nowhere else in the client), toolboxChancePerPoint 0.001, trainingWeightShiftPerPoint as before}: no maxToolboxChancePerHour (0.02 on 2026-10-26); SCAVENGER {toolboxChanceMultiplier 2}. Training count (module 56899): each Trainer holds trainerSessionsPerDay minus trainerSessionsUsed (reset when trainerSessionsUsedAt is on an earlier UTC day, day = floor(ms / 86400000)); a coworker beyond its own training.perDay 1 can train while the company's Trainers (excluding itself) have sessions left; the pools of several Trainers add. UI catalog en/messages.po commits: ce1acae (2026-10-29 19:22Z, v0.27.3) -> 89b0525 (20:20Z): Luck text lost '(up to {LUCK_MAX_PERCENT}%)', Scavenger 'x2 toolbox chance and cap' -> 'x2 toolbox chance', 'Capped at {cappedPct}%' removed; -> 0ac5360 (2026-10-31 19:07Z): '{handRarityName} hand.', 'Pick one, the others are lost.', card estimated profit text, skin-proposition count removed; -> 77f0bc4 (2026-10-31 22:16Z): Lucky charm note 'Given at 00:00 UTC to whoever works beside them then, and kept until the next reset, even if someone changes company.', Trainer 'Gives coworkers {2} extra training sessions a day, shared between them' + 'Refills at 00:00 UTC.' (removed: 'Lets every coworker train 2 times a day'), '{left}/{perDay} sessions left today', and the Reorganize workforce strings."
  - id: LIVEAPI_20261101
    title: "Live API sample with the bot's API key, 2026-11-01 (read-only, ~1 request/s)"
    date: "2026-11-01"
    game_version: "v0.27.3 + silent patch 2026-10-31"
    priority: 1
    kind: trusted_script_output
    notes: "company.getCompanies (first 60) and employee.getCompanyRoster for each, read about 19:15 UTC. New employee fields: charmLuck {amount 3, until} on coworkers of a Lucky charm (never on the charm itself), until = the next 00:00 UTC + 1 h (2026-11-02T01:00Z for the 00:00 hand-out of 2026-11-01; 2026-11-01T01:00Z on employees charmed during 2026-10-31, which bounds the deploy to that UTC day); an employee who moved away at 16:57Z still carried an expired one. Trainers carry trainerSessionsUsed 2 and trainerSessionsUsedAt equal to a coworker's lastTrainedAt to the millisecond, so the pool lives on the Trainer. One coworker of a Trainer had trainingsToday 3 (its own draw plus both pooled sessions), and a Lucky charm holder had trainingsToday 3 at 2026-10-31T23:35Z."
  - id: PATCH_0_27_4
    title: "Admin article 'v0.27.4 + New skins giveaway' (6ae8bb12bcc26a2f5712ec9d)"
    date: "2026-11-02"
    game_version: "v0.27.4"
    priority: 2
    kind: patch_notes
    notes: "Official (category official, author 6813b758efecdf9bab195068), read in full with article.getArticleById on 2026-11-02, both images viewed (6 skin packs, cosmetic). createdAt 2026-11-02T16:32:18Z, publishedAt 16:36:18Z, updatedAt 17:54Z (no '(UPDATED)' in the title). Tools: equip window like equipment, shows holders' Production; '?' lists every tool and its goods; a tool that doesn't fit the employee's new company returns to the inventory. Employees: age +1 year per day worked or trained, not per calendar day; new trait Talks to Machines (doubles the Automated Engine output while the company's only employee); Responsibility shown as its lasting happiness (+3 per point), effect unchanged; Bully counts as a negative trait; 'A bug didnt count the production stat given by traits in the expected wage calculation' / 'Fixed: Production plain stat from traits now counts toward the expected wage' (contradicted for the paid wage by LIVEAPI_20261102, U-V274-1). Disabled companies: employees on hold (no ageing, pause icon; no training, not in the to-train list or training missions; warning before moving someone in). Training: Reroll (Uncommon) swaps the hand for free; Wild card Rare and +2 (was +1); 'Defined traits are no longer offered as Rare cards' (= the mixed-trait New habit, per the client); cards show daily profit when the result isn't random, hand rarity above; smoother window. Events (credited to Johnny_Sins, 697b55e4bcecf3b37667e0d1): 23 paid answers cheaper (tattoo correction 2 -> 0.1 wage-days), van race x3 (was x2), gambler loan x2 (was x1), night-shift toolbox always works and +20% for 5 days, the hat makes the pair Old Friends, the lift technician cures Claustrophobe, Strange mood asks about 9 money's worth of the company's good, fairer rolls in Time to retire, Gerald and The ducks. Other: new countries' citizens can vote at once during the country's first 14 days (instead of waiting 7 days); dismantle filters multi-select; crafting unlocks at level 7 (was 10); donate missions tagged on the Country/MU buttons; company card header; workforce summary in companies-page order. Fixes: white map on mobile; missions after a break (a fresh set instead of a stuck one, sometimes for a month); automatic switch to the latest version on page change. Shop: 6 skin packs, packs can include a free banner, giveaway. effective_from uses the publishedAt day (2026-11-02, user rule 2026-10-13); the UI catalog commit 'v0.27.4' is 16:22:50Z."
  - id: LIVECLIENT_V0274
    title: "Live client bundle (pages/_app-08814d1f154569f9.js), gameConfig and the English UI catalog (vatoutou/warera-translation 77f0bc4 -> 4838d69), read 2026-11-02"
    date: "2026-11-02"
    game_version: "v0.27.4"
    priority: 1
    kind: trusted_script_output
    notes: "Read-only, no key, ~18:00-19:30 UTC. Traits: 53 (TALKS_TO_MACHINES {group WORK, polarity POSITIVE, condition SOLE_EMPLOYEE, weight 5, effect engineOutputMultiplier 2}), weights 359 (349 per gender), polarity counts positive 27 / negative 16 / mixed 10; BULLY polarity NEGATIVE (effect selfProductionDelta 2, coworkerHappiness -10); 36 incompatible pairs (the 30 of 2026-10-30 plus Talks to Machines with Sociable, Comic, Foreman, Mentor, Trainer, Lucky charm). Employee constants: traitsPerEmployee {1,1}; startAge 18-45; aging {yearsPerDay 1}; potentialMax 3-10; happiness {neutral 50, storageFullPenalty 10, unpaidPenalty 10, taxPenaltyPerPercent 1, quitChanceMax 0.05}; happinessQuitThreshold 30; ppMoneyValueFallback 0.1; wageExpectationSpread 0.3; rerollEnergyCost 10; hireEnergyCost 10; fire {hireLockHours 12}; move {companyMoveHappinessPenalty 10, penaltyDays 7}; battle {happinessPenalty 5}; specialization {percentPerDay 1, maxPercent 20}; training {perDay 1, energyCost 10, handSize 3, secondWindGains 2/3/4 R/E/L, potentialMaxCap 15, drillDeltas 1-4, wildCardStatGain 2 (new), rarityWeights 55/25/13/5/2, fixedRarity {wildCard RARE (was UNCOMMON), reroll UNCOMMON (new), rehabNegativeSpecial RARE}, negotiationDrops 5/10/20 C/U/R, wageExpectationFloor 0.7, habitRarityByPolarity {positive EPIC} (mixed RARE gone), habitPairRarity LEGENDARY, rehabAll {minNegatives 2, LEGENDARY}}; outputVarianceSpread 0.1; outputDivisor 4; coreRegionBonusPercent 5; luck {charmGraceHours 1, toolboxChancePerPoint 0.001, trainingWeightShiftPerPoint 0.5/0.3/0.15/0.05}; responsibilityHappinessPerPoint 3; skills {managementBonusPercentPerLevel 2, managementWeightShiftPerLevel 1/0.6/0.3/0.1}. The client shows the pause icon when lastAgedDay differs from today's UTC date. Card pool: Wild card offered when a non-clashing trait exists, Reroll always added. All 78 event definitions re-read (pools and weights as before; costs and outcomes per references/employee-events.md). Wage and the Strange mood demand value are computed server-side (no client formula). gameConfig (check_config.py, read-only): new key election.voteCitizenshipLockNewCountryMultiplier 2; user.featureUnlockLevels.craft 7 (10 on 2026-10-26); no other non-item key changed against the earlier v0.27 reads (208 / 65 / 63 added/removed/changed vs the 2026-10-04 snapshot; the drop from 250 added is the leadership skill keys removed by v0.27.3). UI catalog 4838d69 (2026-11-02 16:22:50Z, 'v0.27.4') vs 77f0bc4: 44 strings added, 35 removed: disabled-company texts ('will not work, age or train there', 'Its employees do not age until they work again. Training still ages them.', 'Not aging: no work or training today'), tool-return texts, Reroll and Wild card (+2) texts, 'Teaches one mixed trait' removed, 'Talks to Machines', event texts (pays triple, pays back twice over, lift fear cured, hat friends for life, Strange mood 'About {demandValue} of the company's good' and 'Never in a cocaine company'), Responsibility relabelled 'Personal morale' / 'A lasting boost to their happiness'."
  - id: LIVEAPI_20261102
    title: "Live API sample with the bot's API key, 2026-11-02 (read-only, ~1 request/s)"
    date: "2026-11-02"
    game_version: "v0.27.4"
    priority: 1
    kind: trusted_script_output
    notes: "company.getCompanies (first 70) and employee.getCompanyRoster for each, read about 19:00 UTC: 162 employees. New employee fields lastAgedDay (YYYY-MM-DD) and companyDisabled (false for all); roster hourly.engineMultiplier 1 in all 70 companies (no Talks to Machines holder seen). gameStat.getPpMoneyValue 0.099. Wages: for every employee, wage = (breakdown.production.base + trained) / 4 x 0.099 x wageExpectation to three decimals; in all 82 with flat trait Production (contributions without percent, e.g. Craftsman +3, Expat +2, Early bloomer +6, Mentor -1) the trait part is NOT paid, including 4 (flat +9, +3, +3, +2) whose wage was recalculated by a drill or Negotiation drawn after 16:22Z, and 6 hires made after the deploy. API trap: the employee's base.production equals breakdown base + trained, not the rolled base. One card drawn at 12:02Z (before the deploy) was a Rare New habit -> Craftsman (a mixed trait), consistent with the pre-v0.27.4 card pool."

  - id: PATCH_0_28
    title: "Admin article 'v0.28 (Nuking movement + perf)' (6aea1496b615c31fa0eb4152)"
    date: "2026-11-03"
    game_version: "v0.28"
    priority: 2
    kind: patch_notes
    notes: "Official (category official, author 6813b758efecdf9bab195068), read in full with article.getArticleById on 2026-11-04 (3,043 characters, no images). createdAt/publishedAt 2026-11-03T17:07Z, updatedAt 2026-11-04T17:31Z (no '(UPDATED)' in the title; the text opens 'Update is live'). Now: fight in any battle from anywhere, no Move button or travel cost. In 7 days: movement off (no travel, no Stamina, no wooden cases on the map), wooden cases held can still be opened, wooden-case market listings and buy orders refunded, travel and wooden-case milestones disabled ('could come back in next versions w/ saved level'), travel and wooden-case missions replaced. Battles: Last Hits rework (hits and damage per second), Alliance filter in battle rankings. Settings window (Graphics/Map/Interface/General; presets Low/Medium/High/Custom; map max pixel ratio x1-x3; map arcs off; lighter GIFs, memory, start). Employees: stats panel back (daily output and wage); Nationalist, Statist and Foreman give happiness directly, on their own line, not inside Personal morale (Responsibility); Nationalist +11 -> +10. Other: tutorial skips 'This is your company'; loading screen shows the build number; the 71 links removed by v0.27 now closed after their 10 days of grace. Fix: enabling a company allows training at once. The movement switch-off time is relative ('in 7 days'), so it is recorded at day precision (2026-11-10)."
  - id: LIVECLIENT_V028
    title: "Live client bundle (pages/_app-90d4b44c9f47c314.js), gameConfig and the English UI catalog (vatoutou/warera-translation 4838d69 -> 3f60446), read 2026-11-04"
    date: "2026-11-04"
    game_version: "v0.28"
    priority: 1
    kind: trusted_script_output
    notes: "Read-only, no key, ~19:30 UTC. New gameConfig keys (live API, also shipped in the client): battle.locationGateEnabled false (the battle panel computes needsToMove and the fight region only when it is true; Move-to-fight button gone) and mapTravel {movementEnabled, travelHomeEnabled, mapCasesEnabled, positionMarkerEnabled, staminaBarEnabled}, all true on 2026-11-04 (the client hides the travel-home button, the Stamina bar, map cases, the Loot chance skill's wooden-case sentence and a 'map' group of progression entries when they are false; flags are ANDed with movementEnabled). The warera-config snapshot has neither key. region.homeMoveConcreteCost 100 and freeTravelHomeCooldownHours 12 unchanged; woodenCase {lootChancePercent 25, maxPerUser 5, expiryHours 48, starterCases 3 x 168 h} unchanged. Trait table: NATIONALIST {condition COWORKERS_SHARE_NATIONALITY, weight 10, effect {happiness 10}}, STATIST {condition HIGH_TAX, weight 10, effect {happiness 6, taxAtLeast 20}}, FOREMAN {condition ANY_COWORKER, weight 5, effect {coworkerHappiness 9}}; none adds Responsibility any more. Event checks: 59 STANDARD and 47 LUCK, none on Responsibility, so the change moves no event odds. UI catalog commit 3f60446 (2026-11-03T17:02:30Z, five minutes before the article): +23 / -10 strings; removed 'Move to the battle first (costs Stamina), then hit.', 'Get to the front!', 'Options', 'This is your company', '<0>Energy</0> to work, <1>Stamina</1> to travel.'; added Settings tabs (Graphics, Interface), presets (Low, Medium, High, Custom), 'Map pixel ratio', 'Arcs', 'Daily output', 'Daily wage', 'Alliances', 'build {build}'; the Loot chance text split so its wooden-case sentence can be hidden."
  - id: LIVEAPI_20261104
