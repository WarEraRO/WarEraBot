# Equipment, weapons, scrap and crafting tables. Sources: GUIDE 21.2/28 + LIVECFG items.* (2026-10-04); case odds WIKI / CODEX; v0.27 wooden cases PATCH_0_27 (+ CODEX-derived quantities, 2026-10-26).
table_version: 1
as_of: "2026-10-26"

rarities: [common, uncommon, rare, epic, legendary, mythic]
rarity_colors: {common: grey, uncommon: green, rare: blue, epic: purple, legendary: yellow, mythic: red}
slots:
  weapon: {stats: [attack, criticalChance]}
  helmet: {stats: [criticalDamages]}
  chest:  {stats: [armor]}
  pants:  {stats: [armor]}
  boots:  {stats: [dodge]}
  gloves: {stats: [precision]}
level_requirements: none
tradable: false   # weapons and equipment are not market-tradable in config; cases and scrap are

# Stat ranges [min, max] per rarity (LIVECFG dynamicStats). Gaps between tiers are real - never interpolate.
weapons:
  knife:  {rarity: common,    attack: [21, 40],   crit: [1, 5],   ammo: false}
  gun:    {rarity: uncommon,  attack: [51, 60],   crit: [6, 10]}
  rifle:  {rarity: rare,      attack: [71, 90],   crit: [11, 15]}
  sniper: {rarity: epic,      attack: [101, 130], crit: [16, 20]}
  tank:   {rarity: legendary, attack: [141, 170], crit: [26, 35]}
  jet:    {rarity: mythic,    attack: [221, 300], crit: [41, 50]}
equipment:
  common:    {helmet: [1, 15],    chest: [1, 5],   pants: [1, 5],   boots: [1, 5],   gloves: [1, 5]}
  uncommon:  {helmet: [16, 30],   chest: [6, 10],  pants: [6, 10],  boots: [6, 10],  gloves: [6, 10]}
  rare:      {helmet: [31, 50],   chest: [11, 15], pants: [11, 15], boots: [11, 15], gloves: [11, 15]}
  epic:      {helmet: [71, 90],   chest: [21, 30], pants: [21, 30], boots: [21, 25], gloves: [21, 25]}
  legendary: {helmet: [91, 110],  chest: [36, 50], pants: [36, 50], boots: [31, 40], gloves: [31, 40]}
  mythic:    {helmet: [121, 150], chest: [56, 70], pants: [56, 70], boots: [51, 60], gloves: [51, 60]}

# GUIDE 21.2. craft scrap == scrap from dismantling an unused item, so the real crafting cost is the steel.
crafting:
  common:    {scrap: 6,    steel_random: 1,  steel_specific: 2,  scrap_when_broken: 2}
  uncommon:  {scrap: 18,   steel_random: 2,  steel_specific: 4,  scrap_when_broken: 6}
  rare:      {scrap: 54,   steel_random: 4,  steel_specific: 8,  scrap_when_broken: 18}
  epic:      {scrap: 162,  steel_random: 8,  steel_specific: 16, scrap_when_broken: 54}
  legendary: {scrap: 486,  steel_random: 16, steel_specific: 32, scrap_when_broken: 162}
  mythic:    {scrap: 1458, steel_random: 32, steel_specific: 64, scrap_when_broken: 486}
crafting_rules:
  - "Manual dismantle returns scrap proportional to remaining durability (100% -> full scrap column)."
  - "Item reaching 0 durability in battle breaks and auto-dismantles for 1/3 of new-item scrap."
  - "Specific crafting costs double the steel of random crafting."
  - "LIVECFG mergingCost (2/4/8/16/32/64) equals the steel_specific column - plausible mapping, unconfirmed."

