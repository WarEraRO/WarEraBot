# Community stat-equivalence observations (GUIDE 28.5) - player-specific, NOT rules.
stat_equivalences_observed:
  context: "pill, green ammo, rank +25%, precision capped at 100%"
  rows:
    - {profile: "level 40, full epic",      attack: 5, precision_pct: 1.2, crit_chance_pct: 1, crit_damage_pct: 5}
    - {profile: "level 45, full legendary", attack: 6, precision_pct: 1.5, crit_chance_pct: 1, crit_damage_pct: 4.5}
    - {profile: "level 50, full mythic",    attack: 9, precision_pct: 2.3, crit_chance_pct: 1, crit_damage_pct: 4}

# Regular-case rarity split (WIKI-ONLY) and elite-case split (CODEX: community guides, not official). Percent.
case_rarity_odds:
  case: {common: 62, uncommon: 30, rare: 7.1, epic: 0.85, legendary: 0.04, mythic: 0.01}
  elite_case: {common: 0, uncommon: 50, rare: 32, epic: 15, legendary: 2.5, mythic: 0.5}
  weapon_share_percent: 30
  scrap_ev: {case: 14.7, elite_case: 70}

# Pre-v0.27 wooden cases (until 2026-10-26). v0.27 table below (wooden_case_drops_v027).
wooden_case_drops:
  rarity_odds: {epic: 2, rare: 13, uncommon: 20, common: 65}
  pools:
    epic: [cookedFish, heavyAmmo, cocain]
    rare: [ammo, steak]
    uncommon: [concrete, steel, bread, oil, paper, lightAmmo]
    common: [grain, iron, wood, lead, limestone, coca, petroleum, livestock, fish]
  quantity_by_item:
    "20-80": [grain, iron, wood, lead, limestone, coca, petroleum, oil, paper, lightAmmo]
    "5-20": [ammo]
    "2-8": [concrete, steel, bread]
    "1-5": [heavyAmmo]
    "1-4": [livestock, steak]
    "1-2": [fish, cookedFish]
    "1": [cocain]
  budget: "random 20-80 work points converted to the drawn resource; two cases are worth roughly the same"

