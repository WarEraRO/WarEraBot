# Sources: official patch notes as transcribed on warera.wiki/en/patch-notes (source id WIKIPATCH, v0.0.2 -> v0.17.7, fetched
# 2026-10-05) and the in-game articles of category `official` (source ADMIN_PATCHES, plus PATCH_0_25_1 / PATCH_0_26_2 / PATCH_0_27),
# all read in full on 2026-10-25; PATCH_0_27_1, PATCH_0_27_2, PATCH_0_27_3, PATCH_0_27_4 and PATCH_0_28 read on 2026-10-27, 2026-10-29, 2026-10-30, 2026-11-02 and 2026-11-04. Silent (unannounced) changes found by live checks carry a `silent-` / `unannounced-` version label and the live source. Entries with their own `source:` come from the articles, the rest from WIKIPATCH.
# A NEWER patch overrides an older one wherever they overlap (user rule, 2026-10-25): read the log newest first, and derive the
# current value of a mechanic from the newest entry that touches it.
# Dates: the admin article's publishedAt day (effective 00:00 UTC; user decision 2026-10-13). Where a translation or the article's
# ObjectId shows the patch earlier, the entry's notes say so.
# Only gameplay-relevant entries are kept (no emotes, skins, UI, translations); mechanic_ids link to mechanics.yaml.
# No article exists for v0.19.1. Versions without a title number: v0.26.2 (civil-war hotfix) and the dated announcements below.
