      - "Ethics rework: Expansionist upgrade cooldown 4 h (Fanatic 2 h, pacification +2.5% defense per level, occupied regions hijack x2 resistance); Pacifist core revolt-defense orders 1/2 (Fanatic free, revolts copy the bunker, no sworn enemy); Diplomatic pact upkeep x0.8 (Fanatic x0.5, pact orders x0.5, sworn upkeep x2); Isolationist enemy bonus from +2/+2 per day (Fanatic +5/+5, enemy orders x0.5, treaty upkeep x1.5); Republican development income +50% (Fanatic +150%, core regions only); Fanatic Imperialist upgrade upkeep x1.5; Unethical: national orders double bonus at double paper, no treaties, occupied capital -> normal bonus + auto revolt"
      - "Ethic change cooldown 2 weeks"
      - "Wood and Paper added (1 wood -> 1 paper); specialization group limestone/iron/wood, concrete/steel/paper"
      - "Politics paid in paper: laws max(base, round(base x average development / 10)); country orders max(1, floor(average development / 5)) x priority; MU orders max(1, floor(members / 5)) x priority; party motions core development x 10 from the party inventory"
      - "Send money to country: transfer tax in paper, 50% inside your alliance, 100% otherwise; recipient gets the full amount"
      - "Development split into Core, Current and Average (midpoint); order, treaty and upgrade upkeep use Average"
      - "Government announcements (President, VP, Minister of Defense): 24 h, max 2 per hour"
      - "Military base and bunker: allies get half the bonus (citizens full)"
      - "Migration: all alliances removed, every sworn enemy set to its max bonus, paper grants (country 20 x core development, party with ethics 400, MU 20 x active members)"
