# Progression tables (skills, missions, milestones, login rewards, prestige).
# Volatile scalars are mirrored from mechanics.yaml - mechanics.yaml wins on any mismatch.
# The skills table below is pre-v0.27; from 2026-10-26 see mechanics.yaml skills.economy_values (Entrepreneurship removed,
# Energy 100+10, Production 30+3, Leadership added). v0.27 missions: self-work counts for work missions; new train/event/care missions.
