# Battle damage bonus sources. Numbers live in mechanics.yaml (mechanic_id); this file describes
# WHEN each source applies, so the calculator and Claude can decide applicability.
# Battle bonuses are ADDED together (guide 33.1 sums them), then floored at -100%.
# Pill, ammo and military rank are separate multipliers in the (unpublished) damage formula - NOT part of this sum.
table_version: 1
as_of: "2026-10-25"
aggregation: additive
floor_mechanic_id: bonus.total_floor

sources:
  - key: patriotic
    mechanic_id: bonus.patriotic
    applies_when: "your citizenship country is one of the two sides (attack, defense, revolt)"
  - key: country_order
    mechanic_id: bonus.country_order
    applies_when: "your country has an order on the side you hit; stacks with MU order. Can't be set on civil wars (v0.26.2, 2026-10-14)"
    disputed: true
  - key: mu_order
    mechanic_id: bonus.mu_order
    applies_when: "your MU has an order on the side you hit"
    disputed: true
  - key: unethical_country_order
    mechanic_id: bonus.unethical_country_order
    applies_when: "country uses Unethical ethic; replaces the normal country order value. Until v0.27 (2026-10-26), when ethics end; successor Mercenary State order damage x2 (government.types)"
  - key: headquarters
    mechanic_id: bonus.headquarters
    applies_when: "your MU HQ is active (has oil); config names it attackBonus - whether it also applies on defense is not stated"
  - key: alliance
    mechanic_id: bonus.alliance
    applies_when: "fighting for an alliance partner (or with partner? guide table applies it on 'ally' scenarios and own attack). Depends on alliance share of world development; can be negative"
    disputed: true
  - key: defensive_pact
    mechanic_id: bonus.defensive_pact
    applies_when: "defending the pact partner's territory; in revolts, the side recovering its homeland. +1%/day up to +10%"
  - key: main_enemy
    mechanic_id: bonus.main_enemy
    applies_when: "attacking or defending against the declared Main Enemy. +1%/day up to +10% (Isolationist faster)"
  - key: resistance
    mechanic_id: bonus.resistance
    applies_when: "attackers in a revolt; 30% for citizens / 15% for allies at full bar, proportional to fill"
  - key: military_base
    mechanic_id: bonus.base
    applies_when: "attack launched from a region with an ACTIVE base; allies get half"
  - key: bunker
    mechanic_id: bonus.bunker
    applies_when: "defending a region with an ACTIVE bunker; allies get half. Never in civil wars (v0.26.2, 2026-10-14)"
  - key: pacification_center
    mechanic_id: bonus.fanatic_expansionist_pacification
    applies_when: "Fanatic Expansionist country defending a revolt in a region it occupies: +3% per Pacification Center level"
  - key: not_linked_to_capital
    mechanic_id: malus.not_linked_to_capital
    applies_when: "you are the DEFENDER of a region not connected to its capital"
  - key: fighting_for_occupier
    mechanic_id: malus.fighting_for_occupier
    applies_when: "you fight FOR a country that occupies at least one core region of your country"
  - key: lost_attacking_region
    mechanic_id: malus.lost_attacking_region
    applies_when: "UNKNOWN - live-only config key, condition undocumented"

# Guide 33.1 reference scenarios (assumes High orders, HQ L4, pact/enemy maxed, full resistance,
# max buildings, alliance at full +20%). Used as regression tests for combat_bonus_calculator.py.
reference_scenarios:
  - {name: own_revolt,             total: 110,   parts: {patriotic: 20, country_order: 15, mu_order: 15, headquarters: 20, main_enemy: 10, resistance: 30}}
  - {name: enemy_revolt,           total: 105,   parts: {patriotic: 20, country_order: 15, mu_order: 15, headquarters: 20, main_enemy: 10, bunker: 25}}
  - {name: allied_revolt,          total: 117.5, parts: {country_order: 15, mu_order: 15, headquarters: 20, alliance: 20, defensive_pact: 10, main_enemy: 10, resistance: 15, bunker: 12.5}}
  - {name: non_allied_revolt,      total: 70,    parts: {country_order: 15, mu_order: 15, headquarters: 20, defensive_pact: 10, main_enemy: 10}}
  - {name: enemy_revolt_vs_nonally, total: 60,   parts: {country_order: 15, mu_order: 15, headquarters: 20, main_enemy: 10}}
  - {name: defense,                total: 105,   parts: {patriotic: 20, country_order: 15, mu_order: 15, headquarters: 20, main_enemy: 10, bunker: 25}}
  - {name: allied_defense,         total: 115,   parts: {country_order: 15, mu_order: 15, headquarters: 20, alliance: 20, defensive_pact: 10, main_enemy: 10, bunker: 25}}
  - {name: non_allied_defense,     total: 70,    parts: {country_order: 15, mu_order: 15, headquarters: 20, defensive_pact: 10, main_enemy: 10}}
  - {name: attack,                 total: 125,   parts: {patriotic: 20, country_order: 15, mu_order: 15, headquarters: 20, alliance: 20, main_enemy: 10, military_base: 25}}
  - {name: allied_attack,          total: 92.5,  parts: {country_order: 15, mu_order: 15, headquarters: 20, alliance: 20, main_enemy: 10, military_base: 12.5}}
  - {name: non_allied_attack,      total: 60,    parts: {country_order: 15, mu_order: 15, headquarters: 20, main_enemy: 10}}
  - {name: unethical_own_revolt_capital_free,  total: 115, parts: {patriotic: 20, unethical_country_order: 30, mu_order: 15, headquarters: 20, resistance: 30}}
  - {name: unethical_own_revolt_capital_taken, total: 100, parts: {patriotic: 20, unethical_country_order: 15, mu_order: 15, headquarters: 20, resistance: 30}}
  - {name: unethical_other_capital_free,       total: 65,  parts: {unethical_country_order: 30, mu_order: 15, headquarters: 20}}
  - {name: unethical_other_capital_taken,      total: 50,  parts: {unethical_country_order: 15, mu_order: 15, headquarters: 20}}

notes:
  - "Guide table inconsistency (U-CMB-4): 'allied_defense' lists bunker +25% although allies are said to get half (12.5%), while 'allied_revolt' and 'allied_attack' do halve. The calculator halves for allies; the self-test reproduces the guide total via override."
  - "Guide table oddities (kept, not corrected):'attack' includes alliance +20% even though the attacker is your own country; 'enemy_revolt' gives patriotic +20% (you defend your own occupation). The unethical table shows the order dropping to +15% when your capital is occupied and patriotic absent in 'other battles'. Treat the table as illustrative."
  - "Ethics: Pacifist Fanatic makes core-defense and revolt orders free (no paper), copies the enemy bunker bonus when starting a revolt in enemy-occupied territory, and forbids a Main Enemy."
